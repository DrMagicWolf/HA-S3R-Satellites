---
# =============================================================================
# atomechos3r/core.yaml — hardware-independent core for AtomEchoS3R HA Satellites
# ESPHome 2026.8.x, ESP-IDF, ESP32-S3
#
# Requires a hardware package that defines:
#   microphone  id: i2s_mic        (16 kHz, 16-bit)
#   speaker     id: i2s_speaker    (48 kHz, 16-bit, mono)
# Requires an LED package that defines these scripts (may be empty):
#   led_idle, led_listening, led_thinking, led_replying,
#   led_playing, led_muted, led_error, led_not_ready, led_off
# =============================================================================

substitutions:
  name: atomechos3r-ha-satellite
  friendly_name: AtomEchoS3R HA Satellite
  volume_max: "0.85"
  volume_initial: "0.5"

  wake_word_triggered_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
  timer_finished_sound_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
  error_cloud_expired_file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3
  okay_nabu_model_file: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
  stop_model_file: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json

  # Voice assistant phases
  va_idle: "1"
  va_listening: "2"
  va_thinking: "3"
  va_replying: "4"
  va_not_ready: "10"
  va_error: "11"
  va_muted: "12"
  va_timer_finished: "20"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.0
  on_boot:
    priority: 600
    then:
      - script.execute: led_not_ready
      - delay: 30s
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - lambda: id(init_in_progress) = false;
            - script.execute: update_led

esp32:
  variant: esp32s3
  flash_size: 8MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

psram:
  mode: octal
  speed: 80MHz

# Credentials come from the device file (created by ESPHome Builder on adoption)
api:

ota:
  - platform: esphome
    id: ota_esphome

wifi:
  ap:

captive_portal:

# Wi-Fi provisioning over USB from the ESPHome Builder / ESPHome Web wizard
improv_serial:

logger:
  level: DEBUG
  logs:
    sensor: WARN

button:
  - platform: factory_reset
    id: factory_reset_btn
    internal: true

# -----------------------------------------------------------------------------
# Top button (GPIO41 on every Atom S3-family core)
#   short           -> wake KITT
#   double          -> next track
#   triple          -> previous track
#   hold ~1 s       -> play / pause
#   hold 3–8 s      -> mic mute toggle (acts on release)
#   hold 10 s+      -> factory reset
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    pin:
      number: GPIO41
      mode: INPUT_PULLUP
      inverted: true
    id: user_button
    internal: true
    on_multi_click:
      # single short press
      - timing:
          - ON for at most 0.4s
          - OFF for at least 0.35s
        then:
          - script.execute: button_wake
      # double press
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at most 0.4s
          - OFF for at least 0.35s
        then:
          - media_player.next: sendspin_player
      # triple press
      - timing:
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at most 0.4s
          - OFF for at most 0.35s
          - ON for at most 0.4s
          - OFF for at least 0.35s
        then:
          - media_player.previous: sendspin_player
      # long press ~1 s -> play/pause
      - timing:
          - ON for 0.8s to 2.5s
          - OFF for at least 0.1s
        then:
          - media_player.toggle: sendspin_player
      # long press 3–8 s -> mic mute toggle
      - timing:
          - ON for 3s to 8s
          - OFF for at least 0.1s
        then:
          - switch.toggle: mute
      # 10 s+ -> factory reset
      - timing:
          - ON for at least 10s
        then:
          - button.press: factory_reset_btn

# -----------------------------------------------------------------------------
# Audio chain
#   i2s_speaker (hw pkg)  <-  mixer  <-  announcement_mix_in <- announcement_resampler
#                                    <-  media_mix_in        <- media_resampler
# -----------------------------------------------------------------------------
speaker:
  - platform: mixer
    id: mixer_spk
    output_speaker: i2s_speaker
    num_channels: 1
    bits_per_sample: 16
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mix_in
      - id: media_mix_in
  - platform: resampler
    id: announcement_resampler
    output_speaker: announcement_mix_in
    task_stack_in_psram: true
  - platform: resampler
    id: media_resampler
    output_speaker: media_mix_in
    task_stack_in_psram: true

audio_file:
  - id: wake_word_triggered_sound
    file: ${wake_word_triggered_sound_file}
  - id: timer_finished_sound
    file: ${timer_finished_sound_file}
  - id: error_cloud_expired
    file: ${error_cloud_expired_file}

media_source:
  - platform: audio_file
    id: announcement_file_source
  - platform: audio_http
    id: announcement_http_source
  - platform: sendspin
    id: sendspin_source
    task_stack_in_psram: true
  - platform: audio_http
    id: media_http_source

# Sendspin (multi-room sync)
sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

media_player:
  # Local device player: TTS/announcements + anything HA sends directly
  - platform: speaker_source
    name: None
    id: satellite_player
    volume_min: 0.0
    volume_max: ${volume_max}
    volume_initial: ${volume_initial}
    announcement_pipeline:
      speaker: announcement_resampler
      format: FLAC
      sample_rate: 48000
      num_channels: 1
      sources:
        - announcement_file_source
        - announcement_http_source
    media_pipeline:
      speaker: media_resampler
      format: FLAC
      sample_rate: 48000
      num_channels: 1
      sources:
        - sendspin_source
        - media_http_source
    on_announcement:
      # Duck music and free the single I2S bus: the mic must be stopped before
      # the speaker can start (mic and speaker are mutually exclusive on the S3R).
      - mixer_speaker.apply_ducking:
          id: media_mix_in
          decibel_reduction: 20
          duration: 0.3s
      - script.execute: release_mic
    on_play:
      # Media playback started: the mic must let go of the I2S bus.
      - lambda: id(music_active) = true;
      - script.execute: release_mic
      - script.execute: update_led
    on_idle:
      - mixer_speaker.apply_ducking:
          id: media_mix_in
          decibel_reduction: 0
          duration: 0.5s
      - lambda: |-
          id(music_active) = (id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING);
      - if:
          condition:
            not:
              voice_assistant.is_running:
          then:
            - script.execute: start_wake_word
            - script.execute: set_idle_or_mute_phase
            - script.execute: update_led

  # Sendspin group player: exposed to HA, used by the button for transport control
  - platform: sendspin
    name: Music
    id: sendspin_player
    sendspin_id: sendspin_hub
    on_play:
      - lambda: id(music_active) = true;
      - script.execute: release_mic
      - script.execute: update_led
    on_pause:
      - lambda: id(music_active) = false;
      - script.execute: start_wake_word
      - script.execute: update_led
    on_idle:
      - lambda: id(music_active) = false;
      - script.execute: start_wake_word
      - script.execute: update_led

# -----------------------------------------------------------------------------
# Wake word (on-device fallback; default is streaming "Hey KITT" in HA)
# -----------------------------------------------------------------------------
micro_wake_word:
  id: mww
  microphone: i2s_mic
  stop_after_detection: false
  models:
    - model: ${okay_nabu_model_file}
      id: okay_nabu
    - model: ${stop_model_file}
      id: stop
      internal: true
  vad:
  on_wake_word_detected:
    - script.execute:
        id: play_sound
        priority: true
        sound_uri: "audio-file://wake_word_triggered_sound"
    - wait_until:
        condition:
          - media_player.is_announcing: satellite_player
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing: satellite_player
            - not:
                speaker.is_playing: announcement_mix_in
    - voice_assistant.start:
        wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone: i2s_mic
  media_player: satellite_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - lambda: id(voice_assistant_phase) = ${va_listening};
    - script.execute: update_led
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${va_thinking};
    - script.execute: update_led
  on_tts_start:
    - lambda: id(voice_assistant_phase) = ${va_replying};
    # Free the I2S bus now: the reply is discarded if the speaker cannot start.
    - lambda: |-
        id(va).set_continuous(false);
        id(mww).stop();
    - script.execute: update_led
  on_end:
    - wait_until:
        condition:
          - media_player.is_announcing: satellite_player
        timeout: 0.5s
    - wait_until:
        - and:
            - not:
                media_player.is_announcing: satellite_player
            - not:
                speaker.is_playing: announcement_mix_in
    # Restart wake word capture. In HA mode this is a no-op if VA already
    # auto-restarted (continuous); after a button-triggered session it is needed.
    - if:
        condition:
          lambda: return id(resume_music_after_va);
        then:
          - lambda: id(resume_music_after_va) = false;
          - media_player.play: sendspin_player
        else:
          - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: update_led
  on_error:
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${va_error};
          - script.execute: update_led
          - delay: 1s
          - script.execute: set_idle_or_mute_phase
          - script.execute: update_led
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_uri: "audio-file://error_cloud_expired"
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - script.execute: start_wake_word
    - script.execute: set_idle_or_mute_phase
    - script.execute: update_led
  on_client_disconnected:
    - script.execute: stop_wake_word
    - lambda: id(voice_assistant_phase) = ${va_not_ready};
    - script.execute: update_led
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - wait_until:
        media_player.is_announcing: satellite_player
    - lambda: id(voice_assistant_phase) = ${va_timer_finished};
    - script.execute: update_led

# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------
script:
  # Button wake: interrupt streaming wake-word session, start a direct session
  - id: button_wake
    then:
      - if:
          condition:
            switch.is_on: mute
          then:
            - script.execute: led_muted
          else:
            - if:
                condition:
                  - switch.is_on: timer_ringing
                then:
                  - switch.turn_off: timer_ringing
                else:
                  - if:
                      condition:
                        media_player.is_playing: sendspin_player
                      then:
                        - lambda: id(resume_music_after_va) = true;
                        - media_player.pause: sendspin_player
                  - lambda: id(music_active) = false;
                  - script.execute: release_mic
                  - wait_until:
                      condition:
                        not:
                          speaker.is_playing: i2s_speaker
                      timeout: 3s
                  - script.execute:
                      id: play_sound
                      priority: true
                      sound_uri: "audio-file://wake_word_triggered_sound"
                  - wait_until:
                      condition:
                        - media_player.is_announcing: satellite_player
                      timeout: 0.5s
                  - wait_until:
                      - and:
                          - not:
                              media_player.is_announcing: satellite_player
                          - not:
                              speaker.is_playing: announcement_mix_in
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.start:

  # Stop whatever holds the microphone (streaming VA or on-device mWW) and
  # wait until the mic has actually released the I2S bus. The VA is stopped
  # synchronously in a lambda: a scheduled script.execute races the VA's own
  # continuous auto-restart and both then fight over the single I2S bus.
  - id: release_mic
    mode: restart
    then:
      - lambda: |-
          id(va).set_continuous(false);
          id(va).request_stop();
      - micro_wake_word.stop:
      - wait_until:
          condition:
            and:
              - not:
                  voice_assistant.is_running:
              - not:
                  microphone.is_capturing:
          timeout: 3s

  # Wake word listening is only possible when nothing is playing: the Echo S3R
  # has a single I2S bus, so the microphone and the speaker are mutually
  # exclusive. While music plays, the button is the only way to wake KITT.
  - id: start_wake_word
    then:
      - if:
          condition:
            and:
              - lambda: return !id(music_active);
              - switch.is_off: mute
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - micro_wake_word.start:
      - if:
          condition:
            and:
              - switch.is_off: mute
              - not:
                  - voice_assistant.is_running:
              - lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(true);
            - voice_assistant.start_continuous:

  - id: stop_wake_word
    then:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "In Home Assistant";
          then:
            - lambda: id(va).set_use_wake_word(false);
            - voice_assistant.stop:
      - if:
          condition:
            lambda: return id(wake_word_engine_location).current_option() == "On device";
          then:
            - micro_wake_word.stop:

  - id: set_idle_or_mute_phase
    then:
      - if:
          condition:
            switch.is_off: mute
          then:
            - lambda: id(voice_assistant_phase) = ${va_idle};
          else:
            - lambda: id(voice_assistant_phase) = ${va_muted};

  - id: play_sound
    parameters:
      priority: bool
      sound_uri: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: satellite_player
                announcement: true
      - if:
          condition:
            or:
              - lambda: return priority;
              - not:
                  media_player.is_announcing: satellite_player
          then:
            - media_player.play_media:
                id: satellite_player
                media_url: !lambda return sound_uri;
                announcement: true
      - script.execute: stop_wake_word

  # Central LED dispatcher — the only place that decides what the LED shows.
  # Priority: muted > VA phase > music playing > idle
  - id: update_led
    mode: restart
    then:
      - if:
          condition:
            lambda: return id(init_in_progress);
          then:
            - script.execute: led_not_ready
          else:
            - lambda: |-
                const int phase = id(voice_assistant_phase);
                const bool music = id(sendspin_player).state == media_player::MEDIA_PLAYER_STATE_PLAYING;
                if (phase == ${va_muted}) {
                  id(led_muted).execute();
                } else if (phase == ${va_listening}) {
                  id(led_listening).execute();
                } else if (phase == ${va_thinking}) {
                  id(led_thinking).execute();
                } else if (phase == ${va_replying} || phase == ${va_timer_finished}) {
                  id(led_replying).execute();
                } else if (phase == ${va_error}) {
                  id(led_error).execute();
                } else if (phase == ${va_not_ready}) {
                  id(led_not_ready).execute();
                } else if (music) {
                  id(led_playing).execute();
                } else {
                  id(led_idle).execute();
                }

# -----------------------------------------------------------------------------
# Switches / selects
# -----------------------------------------------------------------------------
switch:
  - platform: template
    name: Microphone Mute
    id: mute
    icon: "mdi:microphone-off"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - lambda: id(voice_assistant_phase) = ${va_idle};
      - script.execute: start_wake_word
      - script.execute: update_led
    on_turn_on:
      - script.execute: release_mic
      - lambda: id(voice_assistant_phase) = ${va_muted};
      - script.execute: update_led

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - media_player.repeat_off:
          id: satellite_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: satellite_player
          pipeline: announcement
          delay: 0ms
      - media_player.stop:
          id: satellite_player
          announcement: true
    on_turn_on:
      - media_player.repeat_one:
          id: satellite_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: satellite_player
          pipeline: announcement
          delay: 1000ms
      - media_player.play_media:
          id: satellite_player
          media_url: "audio-file://timer_finished_sound"
          announcement: true
      - delay: 15min
      - switch.turn_off: timer_ringing

select:
  - platform: template
    entity_category: config
    name: Wake word engine location
    id: wake_word_engine_location
    icon: "mdi:account-voice"
    optimistic: true
    restore_value: true
    options:
      - In Home Assistant
      - On device
    initial_option: In Home Assistant
    on_value:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - wait_until:
                lambda: return id(voice_assistant_phase) == ${va_muted} || id(voice_assistant_phase) == ${va_idle};
            - if:
                condition:
                  lambda: return x == "In Home Assistant";
                then:
                  - micro_wake_word.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - lambda: id(va).set_use_wake_word(true);
                        - voice_assistant.start_continuous:
            - if:
                condition:
                  lambda: return x == "On device";
                then:
                  - lambda: id(va).set_use_wake_word(false);
                  - voice_assistant.stop
                  - delay: 500ms
                  - if:
                      condition:
                        switch.is_off: mute
                      then:
                        - micro_wake_word.start

globals:
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: "true"
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${va_not_ready}
  - id: resume_music_after_va
    type: bool
    restore_value: no
    initial_value: "false"
  - id: music_active
    type: bool
    restore_value: no
    initial_value: "false"
