---
# =============================================================================
# atomechos3r/echo-s3r-led.factory.yaml — factory image, Atom Echo S3R with one
# SK6812/WS2812 on the Grove port (yellow wire = G2). Same adopt flow as
# echo-s3r.factory.yaml. Override led_pin / led_chipset in the adopted file
# if a unit is wired differently.
#
# Replace DrMagicWolf/HA-S3R-Satellites below with your public GitHub repo.
# =============================================================================
substitutions:
  name: atomechos3r-ha-satellite
  friendly_name: AtomEchoS3R HA Satellite LED
  led_pin: GPIO2
  led_chipset: SK6812

esphome:
  name_add_mac_suffix: true
  project:
    name: atomechos3r.ha-satellite-led
    version: "1.2.1"

dashboard_import:
  package_import_url: github://DrMagicWolf/HA-S3R-Satellites/atomechos3r/echo-s3r-led.factory.yaml@main
  import_full_config: false

packages:
  core: !include core.yaml
  hw: !include hw-echo-s3r.yaml
  led: !include led-grove-ws2812.yaml
