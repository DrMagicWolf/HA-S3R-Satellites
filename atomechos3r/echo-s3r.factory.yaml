---
# =============================================================================
# atomechos3r/echo-s3r.factory.yaml — factory image, plain Atom Echo S3R (no LED)
#
# 1. Flash this once onto any S3R (ESPHome Builder → Install, or ESPHome Web).
# 2. Provision Wi-Fi over USB when prompted (Improv).
# 3. The device appears in ESPHome Builder as "Discovered" → Adopt.
#    Adoption creates <name>.yaml with its own API key, OTA password and your
#    Wi-Fi secrets, importing this file as a package.
#
# Replace DrMagicWolf/HA-S3R-Satellites below with your public GitHub repo.
# =============================================================================
substitutions:
  name: atomechos3r-ha-satellite
  friendly_name: AtomEchoS3R HA Satellite

esphome:
  name_add_mac_suffix: true
  project:
    name: atomechos3r.ha-satellite
    version: "1.2.1"

dashboard_import:
  package_import_url: github://DrMagicWolf/HA-S3R-Satellites/atomechos3r/echo-s3r.factory.yaml@main
  import_full_config: false

packages:
  core: !include core.yaml
  hw: !include hw-echo-s3r.yaml
  led: !include led-none.yaml
