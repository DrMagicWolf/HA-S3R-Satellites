---
# =============================================================================
# kitt/hw-echo-s3r.yaml — M5Stack Atom Echo S3R (Atom VoiceS3R) hardware
# ES8311 codec on I2C (G45/G0), I2S on G3/G17/G11, mic DIN G4, DAC DOUT G48,
# NS4150B amp enable G18. Provides i2s_mic and i2s_speaker for kitt/core.yaml.
# =============================================================================

i2c:
  - id: i2c_codec
    sda:
      number: GPIO45
      ignore_strapping_warning: true
    scl:
      number: GPIO0
      ignore_strapping_warning: true
    scan: false

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin:
      number: GPIO3
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO11

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: i2c_codec
    bits_per_sample: 16bit
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: i2s_mic
    i2s_audio_id: i2s_audio_bus
    sample_rate: 16000
    i2s_din_pin: GPIO4
    bits_per_sample: 16bit
    adc_type: external

speaker:
  - platform: i2s_audio
    id: i2s_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO48
    dac_type: external
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: left
    audio_dac: es8311_dac

switch:
  - platform: gpio
    name: Speaker Enable
    id: speaker_enable
    pin: GPIO18
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    disabled_by_default: true
